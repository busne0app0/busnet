<head>

  <script type="application/ld+json">

      "@context": "https://schema.org",

  <!-- 5. Google Consent Mode v2 (За замовчуванням заблоковано для ЄС / GDPR) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'wait_for_update': 500
    });

    // Перевірка попередньо збереженої згоди користувача
    try {
      var savedConsent = localStorage.getItem('busnet_cookie_consent');
      if (savedConsent === 'granted') {
        gtag('consent', 'update', {
          'analytics_storage': 'granted',
          'ad_storage': 'granted',
